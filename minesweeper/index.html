<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUNCHYCARDS - Minesweeper Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }
        .gold-glow {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
        }
        .cell-btn {
            aspect-ratio: 1;
            transition: all 0.1s ease;
            user-select: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center shadow-lg shadow-amber-500/30">
                    <i class="fa-solid fa-bomb text-slate-950 text-xl font-bold"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-amber-400 to-amber-600 bg-clip-text text-transparent">MINESWEEPER</span>
                    <span class="block text-xs text-amber-500/80 font-semibold uppercase tracking-widest">CRUNCHYCARDS Vault</span>
                </div>
            </div>

            <!-- Bankroll & Navigation -->
            <div class="flex items-center space-x-4">
                <div class="bg-slate-950/80 border border-amber-500/40 rounded-2xl px-4 py-2 flex items-center space-x-3 shadow-inner">
                    <div class="w-7 h-7 rounded-full bg-amber-500/20 flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-coins text-xs"></i>
                    </div>
                    <div>
                        <div class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider">Bankroll</div>
                        <div id="bankrollDisplay" class="text-base font-bold text-amber-400">1,000 pts</div>
                    </div>
                </div>

                <a href="../holdem/" class="hidden sm:inline-flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl font-medium text-sm transition border border-slate-700">
                    <i class="fa-solid fa-crown"></i>
                    <span>Poker Room</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden mb-8">
            <div class="absolute -right-16 -top-16 w-64 h-64 bg-amber-500/5 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex flex-col sm:flex-row items-center justify-between mb-6 pb-4 border-b border-slate-800 gap-4">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight flex items-center space-x-3">
                        <span>Vault Minesweeper</span>
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Clear the mines to unlock vault multipliers and earn bankroll points!</p>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="setDifficulty('easy')" id="btn-easy" class="px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-500 text-slate-950 shadow">Easy (1.5x)</button>
                    <button onclick="setDifficulty('medium')" id="btn-medium" class="px-3 py-1.5 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-300 hover:bg-slate-700">Medium (3x)</button>
                    <button onclick="setDifficulty('hard')" id="btn-hard" class="px-3 py-1.5 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-300 hover:bg-slate-700">Hard (6x)</button>
                </div>
            </div>

            <!-- Custom Notification Box -->
            <div id="messageBox" class="hidden mb-6 bg-amber-500/10 border border-amber-500/30 text-amber-300 px-4 py-3 rounded-2xl text-sm flex items-center space-x-3">
                <i class="fa-solid fa-circle-info text-amber-400 text-lg"></i>
                <span id="messageText">Notification message here</span>
            </div>

            <!-- Betting & Status Bar -->
            <div class="mb-6 bg-slate-950/80 border border-amber-500/40 rounded-2xl p-5 backdrop-blur flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
                <div class="flex items-center space-x-6">
                    <div>
                        <div class="text-[10px] text-slate-400 font-semibold uppercase">Mines Left</div>
                        <div id="minesCount" class="text-xl font-extrabold text-red-400">10</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-semibold uppercase">Win Payout</div>
                        <div id="payoutDisplay" class="text-xl font-extrabold text-amber-400">75 pts</div>
                    </div>
                </div>

                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <div class="relative flex-grow sm:flex-grow-0">
                        <input type="number" id="wagerInput" min="10" max="10000" value="50" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-amber-400 font-bold text-sm w-full sm:w-32 focus:outline-none focus:border-amber-500">
                    </div>
                    <button onclick="startNewGame()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold px-6 py-2.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/20 cursor-pointer whitespace-nowrap">
                        New Game
                    </button>
                </div>
            </div>

            <!-- Minesweeper Board Area -->
            <div class="bg-slate-950 border border-slate-800 rounded-3xl p-6 flex flex-col items-center justify-center min-h-[420px] shadow-inner overflow-x-auto">
                <div id="boardContainer" class="grid gap-1.5 w-full max-w-lg mx-auto"></div>
            </div>

        </div>

    </main>

    <header class="border-t border-slate-800 bg-slate-900/50 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 CRUNCHYCARDS Casino. Fully synced with your bankroll vault cache.</p>
    </header>

    <script>
        const BANKROLL_KEY = 'crunchycards_bankroll';

        let currentDifficulty = 'easy'; // easy, medium, hard
        let rows = 9;
        let cols = 9;
        let mineCount = 10;
        let multiplier = 1.5;

        let board = []; // 2D array of { mine, revealed, flagged, count }
        let gameOver = false;
        let gameStarted = false;

        function getBankroll() {
            const val = localStorage.getItem(BANKROLL_KEY);
            if (val === null) {
                localStorage.setItem(BANKROLL_KEY, '1000');
                return 1000;
            }
            return parseInt(val, 10) || 0;
        }

        function setBankroll(amount) {
            localStorage.setItem(BANKROLL_KEY, amount.toString());
            updateBankrollDisplay();
        }

        function updateBankrollDisplay() {
            const pts = getBankroll();
            const el = document.getElementById('bankrollDisplay');
            if (el) el.innerText = pts.toLocaleString() + ' pts';
        }

        function showMessage(msg) {
            const box = document.getElementById('messageBox');
            const text = document.getElementById('messageText');
            if (!box || !text) return;
            text.innerText = msg;
            box.classList.remove('hidden');
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            if (box) box.classList.add('hidden');
        }

        function setDifficulty(diff) {
            currentDifficulty = diff;
            ['easy', 'medium', 'hard'].forEach(d => {
                const btn = document.getElementById(`btn-${d}`);
                if (d === diff) {
                    btn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-500 text-slate-950 shadow';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-300 hover:bg-slate-700';
                }
            });

            if (diff === 'easy') {
                rows = 9; cols = 9; mineCount = 10; multiplier = 1.5;
            } else if (diff === 'medium') {
                rows = 12; cols = 12; mineCount = 20; multiplier = 3.0;
            } else if (diff === 'hard') {
                rows = 16; cols = 16; mineCount = 40; multiplier = 6.0;
            }

            startNewGame();
        }

        function updatePayoutDisplay() {
            const wager = parseInt(document.getElementById('wagerInput').value, 10) || 50;
            const payout = Math.floor(wager * multiplier);
            document.getElementById('payoutDisplay').innerText = payout.toLocaleString() + ' pts';
        }

        function startNewGame() {
            hideMessage();
            const wager = parseInt(document.getElementById('wagerInput').value, 10);
            const bank = getBankroll();

            if (isNaN(wager) || wager <= 0) {
                showMessage('Please enter a valid wager amount.');
                return;
            }
            if (wager > bank) {
                showMessage('You do not have enough points in your bankroll for this wager!');
                return;
            }

            updatePayoutDisplay();
            gameOver = false;
            gameStarted = false;

            document.getElementById('minesCount').innerText = mineCount;

            // Initialize empty board
            board = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    row.push({ mine: false, revealed: false, flagged: false, count: 0 });
                }
                board.push(row);
            }

            renderBoard();
        }

        function placeMines(firstR, firstC) {
            let placed = 0;
            while (placed < mineCount) {
                let rr = Math.floor(Math.random() * rows);
                let cc = Math.floor(Math.random() * cols);
                // Don't place mine on first click or surrounding cells
                if (!board[rr][cc].mine && (Math.abs(rr - firstR) > 1 || Math.abs(cc - firstC) > 1)) {
                    board[rr][cc].mine = true;
                    placed++;
                }
            }

            // Calculate numbers
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].mine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].count = count;
                }
            }
        }

        function handleCellClick(r, c) {
            if (gameOver) return;
            const cell = board[r][c];
            if (cell.flagged || cell.revealed) return;

            if (!gameStarted) {
                gameStarted = true;
                const wager = parseInt(document.getElementById('wagerInput').value, 10);
                setBankroll(getBankroll() - wager); // Deduct wager on start
                placeMines(r, c);
            }

            if (cell.mine) {
                // Hit mine -> Game Over
                cell.revealed = true;
                gameOver = true;
                revealAllMines();
                renderBoard();
                showMessage('Boom! You hit a mine and lost your wager.');
                return;
            }

            revealCell(r, c);
            renderBoard();
            checkWinCondition();
        }

        function handleCellRightClick(e, r, c) {
            e.preventDefault();
            if (gameOver || !gameStarted) return;
            const cell = board[r][c];
            if (cell.revealed) return;

            cell.flagged = !cell.flagged;
            let flaggedCount = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].flagged) flaggedCount++;
                }
            }
            document.getElementById('minesCount').innerText = Math.max(0, mineCount - flaggedCount);
            renderBoard();
        }

        function revealCell(r, c) {
            const cell = board[r][c];
            if (cell.revealed || cell.flagged) return;
            cell.revealed = true;

            if (cell.count === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        function revealAllMines() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].mine) {
                        board[r][c].revealed = true;
                    }
                }
            }
        }

        function checkWinCondition() {
            let won = true;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!board[r][c].mine && !board[r][c].revealed) {
                        won = false;
                        break;
                    }
                }
                if (!won) break;
            }

            if (won) {
                gameOver = true;
                const wager = parseInt(document.getElementById('wagerInput').value, 10);
                const payout = Math.floor(wager * multiplier);
                setBankroll(getBankroll() + payout);
                renderBoard();
                showMessage(`Victory! You cleared the vault and collected ${payout.toLocaleString()} pts (${multiplier}x payout)!`);
            }
        }

        function renderBoard() {
            const container = document.getElementById('boardContainer');
            container.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

            let html = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = board[r][c];
                    let bgClass = 'bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700';
                    let content = '';

                    if (cell.revealed) {
                        if (cell.mine) {
                            bgClass = 'bg-red-950/80 border-red-800 text-red-400';
                            content = '<i class="fa-solid fa-bomb text-xs sm:text-sm"></i>';
                        } else {
                            bgClass = 'bg-slate-900 border-slate-800 text-slate-400';
                            if (cell.count > 0) {
                                const colors = ['', 'text-blue-400', 'text-emerald-400', 'text-red-400', 'text-amber-400', 'text-purple-400', 'text-cyan-400', 'text-pink-400', 'text-indigo-400'];
                                content = `<span class="font-extrabold text-xs sm:text-sm ${colors[cell.count]}">${cell.count}</span>`;
                            }
                        }
                    } else if (cell.flagged) {
                        bgClass = 'bg-slate-800 border-amber-500/50 text-amber-400';
                        content = '<i class="fa-solid fa-flag text-xs sm:text-sm"></i>';
                    }

                    html += `
                        <button onclick="handleCellClick(${r}, ${c})" oncontextmenu="handleCellRightClick(event, ${r}, ${c})" 
                                class="cell-btn rounded-lg border flex items-center justify-center font-bold text-sm shadow-sm ${bgClass}">
                            ${content}
                        </button>
                    `;
                }
            }
            container.innerHTML = html;
        }

        window.onload = function() {
            updateBankrollDisplay();
            updatePayoutDisplay();
            startNewGame();
            document.getElementById('wagerInput').addEventListener('input', updatePayoutDisplay);
        };
    </script>
</body>
</html>
